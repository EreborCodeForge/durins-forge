name: Distribution smoke

# Real EMPTY DIR DoD against Packagist (ereborcodeforge/durins-forge v0.1.0+).

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  distribution-smoke:
    name: Packagist consumer smoke
    runs-on: ubuntu-latest

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: json, pdo, pdo_sqlite, sockets, msgpack
          coverage: none
          tools: composer:v2

      - name: Fresh require from Packagist
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir smoke && cd smoke
          composer require ereborcodeforge/durins-forge:^0.1 --no-interaction --prefer-dist
          test -x vendor/bin/durin
          vendor/bin/durin --help || vendor/bin/durin
          vendor/bin/durin new sample --preset=minimal
          cd sample
          php -r '
            $c = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
            if (array_key_exists("repositories", $c)) {
              fwrite(STDERR, "generated composer.json must not declare repositories\n");
              exit(1);
            }
            if (($c["require"]["ereborcodeforge/durins-forge"] ?? null) !== "^0.1") {
              fwrite(STDERR, "generated app must require ereborcodeforge/durins-forge:^0.1\n");
              exit(1);
            }
            echo "generated composer contract OK\n";
          '
          composer install --no-interaction --prefer-dist
          test -x vendor/bin/durin
          vendor/bin/durin doctor

  distribution-smoke-gate:
    name: Confirm Packagist package exists
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert Forge is on Packagist
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w "%{http_code}" https://packagist.org/packages/ereborcodeforge/durins-forge.json || echo 000)
          echo "Packagist HTTP status for ereborcodeforge/durins-forge: ${code}"
          test "${code}" = "200"
          test -f docs/refactoring/package-contract/current-state.md
          test -f docs/public-api.md
