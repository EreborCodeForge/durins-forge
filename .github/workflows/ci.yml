name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, pdo, pdo_sqlite, sockets, msgpack
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Assert Composer PHP baseline
        run: |
          php -r '
            $json = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
            $constraint = $json["require"]["php"] ?? "";
            if ($constraint !== "^8.5") {
                fwrite(STDERR, "Expected composer.php ^8.5, got: {$constraint}\n");
                exit(1);
            }
            if (PHP_VERSION_ID < 80500) {
                fwrite(STDERR, "CI must run on PHP 8.5+, got: " . PHP_VERSION . "\n");
                exit(1);
            }
            echo "PHP " . PHP_VERSION . " / composer php {$constraint}\n";
          '

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare test environment
        run: |
          cp -n .env.example .env || true
          mkdir -p var/cache var/runtime storage/framework/cache storage/logs logs
          touch database.sqlite

      - name: Run tests
        run: composer test
